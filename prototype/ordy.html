<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ordy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap">
<style>
/* Layout: clinical work surface. Fixed left rail, top bar, content in cards and dense tables; the outside portal is a narrow centred column on the same tokens. */
:root {
  --bg: #f4f5f6;
  --surface: #ffffff;
  --surface-2: #f0f2f3;
  --line: #e2e5e8;
  --line-2: #cbd1d6;
  --ink: #111a21;
  --ink-2: #364350;
  --muted: #64707b;
  --accent: #0e5c66;
  --accent-hover: #0b4c55;
  --accent-ink: #ffffff;
  --accent-soft: #e0eeef;
  --ok: #1d7448; --ok-soft: #e1f2e8;
  --hold: #8f5d00; --hold-soft: #fbefd6;
  --bad: #b0222b; --bad-soft: #fae3e4;
  --info: #2a5ca6; --info-soft: #e4ecf8;
  --range-ok: #cfe8da; --range-out: #f4d3d5;
  --shadow: 0 1px 2px rgba(17,26,33,.05), 0 4px 16px rgba(17,26,33,.04);
  --sans: "Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --mono: "Atkinson Hyperlegible Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1215; --surface: #151a1e; --surface-2: #1b2126; --line: #252d33; --line-2: #34404a;
    --ink: #e8ecee; --ink-2: #c3cbd1; --muted: #8b97a1;
    --accent: #5db4bd; --accent-hover: #79c4cc; --accent-ink: #061315; --accent-soft: #143338;
    --ok: #5cc28c; --ok-soft: #122a1d; --hold: #e2ab4a; --hold-soft: #2d2412; --bad: #f06d74; --bad-soft: #34171a; --info: #82a9e6; --info-soft: #172439;
    --range-ok: #1d4030; --range-out: #4a2125; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1215; --surface: #151a1e; --surface-2: #1b2126; --line: #252d33; --line-2: #34404a;
  --ink: #e8ecee; --ink-2: #c3cbd1; --muted: #8b97a1;
  --accent: #5db4bd; --accent-hover: #79c4cc; --accent-ink: #061315; --accent-soft: #143338;
  --ok: #5cc28c; --ok-soft: #122a1d; --hold: #e2ab4a; --hold-soft: #2d2412; --bad: #f06d74; --bad-soft: #34171a; --info: #82a9e6; --info-soft: #172439;
  --range-ok: #1d4030; --range-out: #4a2125; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .92em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 24px; font-weight: 700; }
h2 { font-size: 16px; font-weight: 700; }
h3 { font-size: 14.5px; font-weight: 700; }
p { margin: 0; }
.label { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Shell */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; text-decoration: none; color: var(--ink); }
.brand b { font-size: 21px; font-weight: 800; letter-spacing: -.03em; }
.brand svg { flex-shrink: 0; }
.ws { display: grid; gap: 1px; padding: 8px 10px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.ws b { font-size: 13px; }
.ws span { font-size: 12px; color: var(--muted); }
.navlink { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; font-weight: 500; }
.navlink:hover { background: var(--surface-2); }
.navlink.on { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.navlink .ct { font: 500 11px var(--mono); min-width: 20px; text-align: center; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.navlink .ct.warn { background: var(--hold-soft); color: var(--hold); }
.navlink .ct.bad { background: var(--bad-soft); color: var(--bad); }
.railsep { margin: 14px 10px 4px; }
.railfoot { margin-top: auto; padding-top: 14px; display: grid; gap: 10px; }
.me { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); padding-top: 14px; }
.av { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.av.sm { width: 26px; height: 26px; font-size: 10.5px; }
.me > div { min-width: 0; }
.me b { display: block; font-size: 13px; }
.me span { font: 11px var(--mono); color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .in { display: flex; align-items: center; gap: 14px; padding: 12px 28px; min-height: 60px; }
.crumbs { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13.5px; min-width: 0; flex-wrap: wrap; }
.crumbs a { color: var(--muted); text-decoration: none; }
.crumbs a:hover { color: var(--ink); }
.crumbs b { color: var(--ink); font-weight: 600; }
.top .r { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.content { padding: 24px 28px 40px; display: grid; gap: 20px; align-content: start; }
.disc { padding: 14px 28px 20px; font: 11.5px var(--mono); color: var(--muted); border-top: 1px solid var(--line); }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); gap: 2px; }
  .brand { padding: 4px 8px 4px 0; } .ws, .railsep, .railfoot { display: none; }
  .navlink { padding: 6px 9px; font-size: 13.5px; }
  .top .in, .content, .disc { padding-left: 16px; padding-right: 16px; }
}

/* Primitives */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 13.5px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { border-color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card > .hd .sub { font-size: 12.5px; color: var(--muted); }
.card > .bd { padding: 16px 18px; }
.card > .bd.flush { padding: 0; }
.pill { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px var(--mono); padding: 2px 8px; border-radius: 4px; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.pill.hold { background: var(--hold-soft); color: var(--hold); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.plain::before { display: none; }
.chk { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.chk.ok { background: var(--ok-soft); color: var(--ok); }
.chk.hold { background: var(--hold-soft); color: var(--hold); }
.chk.bad { background: var(--bad-soft); color: var(--bad); }
.chk.no { background: var(--surface-2); color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; align-content: start; min-width: 0; }
@media (max-width: 1180px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.pagehead .t { display: grid; gap: 4px; }
.pagehead .t p { color: var(--muted); }
.empty { padding: 28px 18px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* Tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th { text-align: left; font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 9px 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
table.t td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
table.t .id { font-family: var(--mono); color: var(--muted); }
table.t .nowrap { white-space: nowrap; }
.who b { display: block; font-weight: 600; }
.who span { font-size: 12.5px; color: var(--muted); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; box-shadow: var(--shadow); text-decoration: none; color: var(--ink); }
.kpi:hover { border-color: var(--line-2); }
.kpi .v { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.kpi .v.warn { color: var(--hold); } .kpi .v.bad { color: var(--bad); } .kpi .v.ok { color: var(--ok); }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis, .kpis.four { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 24px; } }

/* Step track */
.track { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.track .st { position: relative; padding: 0 8px 0 0; display: grid; gap: 4px; }
.track .st .bar { height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 6px; }
.track .st.done .bar { background: var(--ok); }
.track .st.now .bar { background: var(--accent); }
.track .st.fail .bar { background: var(--bad); }
.track .st.hold .bar { background: var(--hold); }
.track .st b { font-size: 13px; }
.track .st span { font: 11.5px var(--mono); color: var(--muted); }
@media (max-width: 700px) { .track { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
.mini { display: inline-flex; gap: 3px; vertical-align: middle; }
.mini i { width: 14px; height: 5px; border-radius: 2px; background: var(--line); }
.mini i.d { background: var(--ok); } .mini i.n { background: var(--accent); } .mini i.f { background: var(--bad); } .mini i.h { background: var(--hold); }

/* Tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 12px; overflow-x: auto; }
.tabs button { background: none; border: 0; padding: 12px 10px 10px; color: var(--muted); font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button .ct { font: 11px var(--mono); margin-left: 4px; color: var(--muted); }

/* Key/value */
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 18px; margin: 0; font-size: 13.5px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* Range bar */
.range { position: relative; height: 8px; border-radius: 4px; width: 140px; max-width: 100%; background: linear-gradient(90deg, var(--range-out) 0 20%, var(--range-ok) 20% 80%, var(--range-out) 80% 100%); }
.range i { position: absolute; top: -3px; width: 4px; height: 14px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
.range i.H, .range i.L { background: var(--bad); }
.val.H, .val.L { color: var(--bad); font-weight: 700; }

/* Feed */
.feed { display: grid; }
.feed .it { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 11px 18px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.feed .it:last-child { border-bottom: 0; }
.feed .it .m { display: grid; gap: 3px; }
.feed .it .m span { font: 11.5px var(--mono); color: var(--muted); }
.feed .bot { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.feed .it.warn .bot { background: var(--hold-soft); color: var(--hold); }
.feed .it.bad .bot { background: var(--bad-soft); color: var(--bad); }
.feed .it.ok .bot { background: var(--ok-soft); color: var(--ok); }

/* Metrics */
.metric { display: grid; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.metric:last-child { border-bottom: 0; }
.metric .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.metric .row b { font-size: 13.5px; }
.metric .row .r { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
.metric .row .r.ok { color: var(--ok); } .metric .row .r.hold { color: var(--hold); } .metric .row .r.bad { color: var(--bad); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter i.hold { background: var(--hold); }
.metric small { color: var(--muted); font-size: 12.5px; }
.cov { display: inline-flex; gap: 4px; }
.cov i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line-2); }
.cov i.y { background: var(--ok); border-color: var(--ok); }

/* Notebook cells (new request) */
.cells { display: grid; gap: 14px; }
.cell { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 14px; }
.cell .no { font: 500 12px var(--mono); color: var(--muted); padding-top: 16px; text-align: right; }
.cell .card > .bd { display: grid; gap: 14px; }
.fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.fields .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .fields { grid-template-columns: minmax(0, 1fr); } .cell { grid-template-columns: minmax(0, 1fr); } .cell .no { display: none; } }
.f { display: grid; gap: 5px; min-width: 0; }
.f label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.f input, .f select, .f textarea { padding: 8px 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); min-width: 0; width: 100%; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.f .hint { font-size: 12px; color: var(--muted); }
.f input.err { border-color: var(--bad); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { border: 1px solid var(--line-2); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; background: var(--surface); text-align: left; }
.opt:hover { border-color: var(--ink-2); }
.opt.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-soft); }
.opt b { font-size: 14px; }
.opt span { font-size: 12.5px; color: var(--muted); }
.seg { display: inline-flex; justify-self: start; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.quick .label { margin-right: 4px; }
.note { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 6px; font-size: 13px; align-items: start; }
.note.ok { background: var(--ok-soft); } .note.hold { background: var(--hold-soft); } .note.bad { background: var(--bad-soft); } .note.info { background: var(--info-soft); } .note.plain { background: var(--surface-2); }
.note b { font-weight: 700; }
.checks { display: grid; gap: 7px; }
.checks div { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; }
.msg { border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); padding: 12px 14px; font: 12.5px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.cmd { font: 12px/1.5 var(--mono); padding: 10px 12px; border-radius: 6px; background: var(--ink); color: var(--bg); overflow-x: auto; white-space: pre; }
.json { font: 12px/1.55 var(--mono); padding: 14px; background: var(--surface-2); border-radius: 6px; overflow: auto; max-height: 560px; white-space: pre; color: var(--ink-2); margin: 0; }
.json .k { color: var(--accent); } .json .s { color: var(--ok); } .json .n { color: var(--info); }
.fhir { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 0; }
.fhir .lst { border-right: 1px solid var(--line); display: grid; align-content: start; }
.fhir .lst button { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 9px 14px; cursor: pointer; display: grid; gap: 1px; }
.fhir .lst button b { font-size: 13px; }
.fhir .lst button span { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fhir .lst button.on { background: var(--accent-soft); }
.fhir .pane { padding: 14px; min-width: 0; display: grid; gap: 10px; align-content: start; }
@media (max-width: 760px) { .fhir { grid-template-columns: minmax(0, 1fr); } .fhir .lst { border-right: 0; border-bottom: 1px solid var(--line); } }
.attempt { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; }
.attempt .h { display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap; }
.doctext { font-size: 14px; line-height: 1.65; display: grid; gap: 10px; max-width: 72ch; }
.doctext h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-top: 6px; }
.doctext ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }

/* Outbox */
.ob { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .ob { grid-template-columns: minmax(0, 1fr); } }
.mail { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: 420px; }
.mail .lst { border-right: 1px solid var(--line); }
.mail .lst button { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; display: grid; gap: 2px; }
.mail .lst button.on { background: var(--accent-soft); }
.mail .lst button b { font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.mail .lst button b em { font-style: normal; font: 11px var(--mono); color: var(--muted); font-weight: 400; }

// ---------- Router ----------
function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1)) || 'overview';
  if (h.startsWith('portal-')) return { view: 'portal', token: h.slice(7) };
  if (h.startsWith('r-')) { const [id, tab] = h.slice(2).split('-'); return { view: 'request', id: Number(id), tab: tab || 'summary' }; }
  if (h.startsWith('patient-')) return { view: 'patient', id: h.slice(8) };
  return { view: h };
}
const go = (h) => { if (location.hash === '#' + h) render(); else location.hash = h; };

const pill = (state) => `<span class="pill ${STATES[state]?.cls || ''}">${esc(STATES[state]?.label || state)}</span>`;
const chk = (res) => `<span class="chk ${res === 'pass' ? 'ok' : res === 'hold' ? 'hold' : res === 'fail' ? 'bad' : 'no'}" aria-label="${res}">${res === 'pass' ? '✓' : res === 'hold' ? '!' : res === 'fail' ? '✕' : '·'}</span>`;
function stepsFor(r) {
  const ev = (e) => S.audit.find((a) => a.requestId === r.id && a.event === e);
  const idOk = r.attempts.find((a) => a.outcome === 'pass') || (r.state === 'verified' || r.state === 'filed' || r.state === 'answer_held');
  const lastAtt = r.attempts[r.attempts.length - 1];
  const s = [
    { k: 'request_sent', label: 'Request sent', st: ev('request_sent') ? 'done' : r.state === 'awaiting_confirmation' ? 'hold' : r.state === 'cancelled' ? 'fail' : '', t: ev('request_sent')?.at },
    { k: 'link_opened', label: 'Link opened', st: ev('link_opened') ? 'done' : '', t: ev('link_opened')?.at },
    { k: 'identity_checked', label: 'Identity checked', st: idOk ? 'done' : r.state === 'identity_held' ? 'hold' : lastAtt?.outcome === 'fail' ? 'fail' : '', t: (r.verifiedAs || lastAtt)?.at },
    { k: 'answer_sent', label: 'Answer sent', st: r.answerSentAt ? 'done' : r.answers.some((a) => a.outcome === 'patient_mismatch') ? 'fail' : '', t: r.answerSentAt || r.answers[r.answers.length - 1]?.at },
    { k: 'answer_filed', label: 'Answer filed', st: r.state === 'filed' ? 'done' : r.state === 'answer_held' ? 'hold' : '', t: r.filedAt }
  ];
  const firstOpen = s.findIndex((x) => !x.st);
  if (firstOpen >= 0 && STATES[r.state]?.open) s[firstOpen].st = 'now';
  return s;
}
const miniTrack = (r) => `<span class="mini" aria-label="Progress">${stepsFor(r).map((s) => `<i class="${s.st === 'done' ? 'd' : s.st === 'now' ? 'n' : s.st === 'fail' ? 'f' : s.st === 'hold' ? 'h' : ''}"></i>`).join('')}</span>`;
function rangeBar(x) {
  if (isNaN(x.low) || isNaN(x.high)) return '';
  const pos = Math.max(2, Math.min(98, 20 + ((x.value - x.low) / (x.high - x.low)) * 60));
  return `<div class="range" role="img" aria-label="${esc(x.value)} against ${esc(x.rangeText)}"><i class="${x.interp}" style="left:${pos}%"></i></div>`;
}
function jsonHTML(o) {
  return esc(JSON.stringify(o, null, 2)).replace(/(&quot;[^&]*?&quot;)(\s*:)/g, '<span class="k">$1</span>$2').replace(/:\s(&quot;.*?&quot;)/g, ': <span class="s">$1</span>').replace(/:\s(-?\d+\.?\d*)/g, ': <span class="n">$1</span>');
}
function counts() {
  const open = S.requests.filter((r) => STATES[r.state]?.open);
  return {
    open: open.length,
    waiting: S.requests.filter((r) => r.state === 'sent' || r.state === 'verified').length,
    decide: S.requests.filter((r) => STATES[r.state]?.decide).length,
    filed: S.requests.filter((r) => r.state === 'filed').length,
    caught: S.audit.filter((a) => a.event === 'misdelivery_caught').length,
    unread: S.outbox.filter((m) => !m.read).length
  };
}
function metrics() {
  const filedBundles = S.requests.filter((r) => r.bundle);
  const resCount = filedBundles.reduce((n, r) => n + r.bundle.entry.length, 0);
  const errCount = filedBundles.reduce((n, r) => n + (r.bundleErrors?.length || 0), 0);
  const efforts = S.requests.filter((r) => r.effort != null).map((r) => r.effort);
  const best = efforts.length ? efforts.slice().sort((a, b) => a - b)[Math.floor(efforts.length / 2)] : null;
  const mc = S.audit.filter((a) => a.event === 'misdelivery_caught');
  const m1 = S.requests.some((r) => mc.some((a) => a.requestId === r.id && a.outcome === 'address_mismatch'));
  const m1Full = S.requests.some((r) => mc.some((a) => a.requestId === r.id && a.outcome === 'address_mismatch') && mc.some((a) => a.requestId === r.id && a.outcome === 'wrong_person'));
  const m2 = S.requests.some((r) => r.addressCheck?.ok && mc.some((a) => a.requestId === r.id && a.outcome === 'wrong_person'));
  const m3 = mc.some((a) => a.outcome === 'patient_mismatch');
  const seen = new Set(S.audit.map((a) => a.event));
  return { resCount, errCount, bundles: filedBundles.length, effort: best, efforts, m1, m1Full, m2, m3, mCount: [m1Full || m1, m2, m3].filter(Boolean).length, cov: EVENTS.filter((e) => seen.has(e)).length, seen };
}

function render() {

function readUpload(file) {
  const tok = parseHash().token; const fr = new FileReader();
  fr.onload = () => { S.sessions[tok].file = { name: file.name, md: String(fr.result) }; S.sessions[tok].error = null; render(); };
  fr.readAsText(file);
}
document.addEventListener('submit', async (e) => {
  e.preventDefault(); const tok = parseHash().token;
  if (e.target.id === 'idpform') {
    const u = document.getElementById('idp-u').value.trim(); const pw = document.getElementById('idp-p').value; const c = citizens().find((x) => x.u === u);
    if (!c || c.pw !== pw) { document.getElementById('idp-err').innerHTML = `<div class="note bad">${chk('fail')}<div>Username or password is wrong. Pick a test citizen above to fill both.</div></div>`; return; }
    login(tok, u); render(); return;
  }
  if (e.target.id === 'newcit') {
    const g = document.getElementById('nc-g').value.trim(), f = document.getElementById('nc-f').value.trim(), b = document.getElementById('nc-b').value;
    if (!g || !f || !b) return;
    const u = (g + '.' + f).toLowerCase().replace(/[^a-z.]/g, '') + (S.citizens.length + 1);
    S.citizens.push({ u, pw: 'demo', given: g, family: f, birthdate: b, sub: uuid(), level: 'full', plays: 'Created by you' });
    S.sessions[tok].pick = u; render(); return;
  }
  if (e.target.id === 'answerform') {
    const ses = S.sessions[tok]; if (!ses.file) return;
    ses.formName = document.getElementById('p-name').value; ses.formDob = document.getElementById('p-dob').value;
    if (!ses.formName.trim() || !ses.formDob) { ses.error = 'Enter the patient’s name and birth date.'; render(); return; }
    const res = await submitAnswer(tok, { md: ses.file.md, fileName: ses.file.name, formName: ses.formName, formDob: ses.formDob });
    if (!res.ok) { ses.error = res.error; if (res.mismatch) ses.file = null; } else ses.error = null;
    render();
  }
});
setInterval(() => { const t = document.getElementById('p-timer'); if (t) t.textContent = fmtDur(Date.now() - Number(t.dataset.start)); }, 1000);
window.addEventListener('hashchange', render);
window.addEventListener('storage', (e) => { if (e.key === KEY) { const v = load(); if (v) { S = v; render(); } } });

function showReset() {
  closeModal();
  const m = document.createElement('div'); m.id = 'modal';
  m.innerHTML = `<div style="position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:40;display:grid;place-items:center;padding:16px" data-act="modal-close"><div class="card" style="max-width:440px;width:100%" role="dialog" aria-modal="true" aria-labelledby="mt" onclick="event.stopPropagation()"><div class="hd"><h2 id="mt">Reset demo data</h2></div><div class="bd" style="display:grid;gap:14px"><p>This replaces all requests, messages and audit entries in this browser.</p><div style="display:grid;gap:8px"><button class="btn pri" data-act="reset-seed">Load the example run</button><span class="muted" style="font-size:12.5px">Request 1 with M2 and M3 caught and the result filed, M1 on a second request, and request 2 waiting for Stefan Kern.</span><button class="btn" data-act="reset-empty">Start empty</button><span class="muted" style="font-size:12.5px">Run the scenario yourself from New request.</span></div><div><button class="btn ghost" data-act="modal-close">Keep current data</button></div></div></div></div>`;
  document.body.appendChild(m); m.querySelector('[data-act="reset-seed"]').focus();
}
function closeModal() { document.getElementById('modal')?.remove(); }

// ---------- Boot ----------
(async function boot() {
  S = load();
  if (!S) { await seed(); }
  if (S.ui.theme) document.documentElement.dataset.theme = S.ui.theme;
  render();
})();
</script>
</body>
