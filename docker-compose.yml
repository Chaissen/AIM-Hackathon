# ordy infrastructure: Matrix, the workspace gateway, HAPI FHIR, Postgres, Keycloak (simulated ID Austria), and the
# eHVD mock.
# The ordy app itself (Next.js + Matrix bot) runs on the host with `pnpm dev`.
services:
  synapse:
    image: matrixdotorg/synapse:latest
    volumes:
      - ./docker/synapse:/data
    ports:
      - "8008:8008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8008/health"]
      interval: 5s
      retries: 30

  workspace:
    image: nginx:stable-alpine
    environment:
      ORDY_WEB_UPSTREAM: ${ORDY_WEB_UPSTREAM:-host.docker.internal:3010}
      NGINX_ENVSUBST_FILTER: ORDY_WEB_UPSTREAM
    volumes:
      - ./docker/workspace/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:80"

  element:
    image: vectorim/element-web:latest
    profiles: [legacy-element]
    volumes:
      - ./docker/element/config.json:/app/config.json:ro
    ports:
      - "8082:80"

  hapi:
    image: hapiproject/hapi:latest
    ports:
      - "8090:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.allow_external_references: "true"
      hapi.fhir.cors.allowed_origin: "*"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ordy
      POSTGRES_PASSWORD: ordy
      POSTGRES_DB: ordy
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordy -d ordy"]
      interval: 3s
      retries: 30

  # Simulated ID Austria. Keycloak imports the realm only when it does not exist yet, so recreate the
  # container after editing the realm file with `docker compose up -d --force-recreate keycloak`.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-demo-2026}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./docker/keycloak/idaustria-sim-realm.json:/opt/keycloak/data/import/idaustria-sim-realm.json:ro
    ports:
      - "8080:8080"
    # The image has no curl or wget, but bash can speak HTTP to the management port.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -Fq ' 200 '
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 2s

  ehvd:
    build:
      context: .
      dockerfile: services/ehvd-mock/Dockerfile
    environment:
      EHVD_ALLOWLIST: ${EHVD_ALLOWLIST:-}
      EHVD_SCHEMA_ERRORS: ${EHVD_SCHEMA_ERRORS:-}
    ports:
      - "8095:8095"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8095/healthz"]
      interval: 5s
      retries: 30

volumes:
  pgdata:
